mosip.database.ip=localhost
mosip.database.port=5455
db.dbuser.password=mosip123
mosip.prereg.database.hostname=localhost
mosip.prereg.database.port=5455
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=none

mosip.base.url=http://localhost:9090
