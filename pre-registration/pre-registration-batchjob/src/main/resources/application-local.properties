# Host-JVM overrides used with profiles default,local. Docker deps: local-dev-setup.
spring.cloud.config.uri=http://localhost:51100/config
spring.cloud.config.name=application,pre-registration
spring.cloud.config.label=local
spring.application.name=pre-registration-batchjob
server.port=9097
server.servlet.context-path=/preregistration/v1

# Config-server "default" still holds ${db.dbuser.password}. Let this file win on the host JVM.
spring.cloud.config.override-none=true
spring.cloud.config.allow-override=true

