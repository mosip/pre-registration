# Host-JVM overrides used with profiles default,local. Docker deps: local-dev-setup.
spring.cloud.config.uri=http://localhost:51100/config
spring.cloud.config.name=application,pre-registration
spring.cloud.config.label=local
spring.application.name=pre-registration-service
server.port=9090
server.servlet.context-path=/preregistration/v1

# Config-server "default" still holds ${db.dbuser.password}. Let this file win on the host JVM.
spring.cloud.config.override-none=true
spring.cloud.config.allow-override=true

javax.persistence.jdbc.driver=org.postgresql.Driver
javax.persistence.jdbc.url=jdbc:postgresql://localhost:5455/mosip_prereg
javax.persistence.jdbc.user=prereguser
javax.persistence.jdbc.password=mosip123
mosip.database.ip=localhost
mosip.database.port=5455
db.dbuser.password=mosip123
mosip.prereg.client.secret=local-dev-secret
mosip.reg.client.secret=local-dev-secret
prereg.captcha.site.key=local-unused
prereg.captcha.secret.key=local-unused
s3.accesskey=minioadmin
s3.secretkey=minioadmin
s3.region=us-east-1
object.store.s3.url=http://localhost:9000
mosip.kernel.objectstore.account-name=prereg
keycloak.internal.url=http://localhost:8082
keycloak.external.url=http://localhost:8082
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=none
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.connection.charSet=utf8
hibernate.cache.use_second_level_cache=false
hibernate.cache.use_query_cache=false
hibernate.cache.use_structured_entries=false
hibernate.generate_statistics=false

mosip.prereg.database.hostname=localhost
mosip.prereg.database.port=5455

mosip.prereg.booking.url=http://localhost:9090
booking.resource.url=http://localhost:9090/preregistration/v1
mosip.preregistration.appointment.getavailablity.url=http://localhost:9090/preregistration/v1/appointment/availability/{registrationCenterId}
mosip.preregistration.appointment.book.url=http://localhost:9090/preregistration/v1/appointment/{preRegistrationId}
mosip.preregistration.appointment.multi.book.url=http://localhost:9090/preregistration/v1/appointment
mosip.kernel.masterdata.url=http://localhost:8082
mosip.kernel.authmanager.url=http://localhost:8082
mosip.kernel.keymanager.url=http://localhost:8088
# WireMock answers POST /v1/auditmanager/audits; this writes the same payload into mosip_audit for PII DB checks.
preregistration.audit.jdbc.url=jdbc:postgresql://localhost:5455/mosip_audit
preregistration.audit.jdbc.user=audituser
preregistration.audit.jdbc.password=mosip123
mosip.kernel.emailnotifier.url=http://localhost:8083
mosip.kernel.notification.url=http://localhost:8083
mail-notification.rest.uri=http://localhost:8083/v1/notifier/email/send
sms-notification.rest.uri=http://localhost:8083/v1/notifier/sms/send
smtp.host=localhost
smtp.port=8025
smtp.username=dummy
smtp.secret=dummy
sms.host=localhost
sms.port=8080
spring.mail.host=localhost
spring.mail.port=8025
spring.mail.username=dummy
spring.mail.password=dummy
mosip.kernel.sms.api=http://localhost:8080/sendsms
mosip.kernel.prereg-application.url=http://localhost:9090/preregistration/v1
mosip.base.url=http://localhost:9090

mosip.preregistration.captcha.enable=false
spring.sleuth.enabled=false
# Login JWT is HS256 with a userId claim. Kernel AuthHandler reads preferred_username
# instead, so this host JVM must authenticate through CustomJWTAuthHandler.
mosip.security.authentication.provider.beans.list.pre-registration-service=customJWTAuthProvider
# PiiEnvironment_01 reads mosip.prereg.pii.backward.compatibility from /actuator/env.
# Boot 3+ masks every env value unless show-values is ALWAYS. Local profile only.
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS
auth.server.admin.validate.url=http://localhost:8082/v1/authmanager/authorize/admin/validateToken
auth.server.admin.issuer.uri=http://localhost:8082/auth/realms/
# Catalog swagger-ui.html is not covered by /**/swagger-ui/** (index.html only).
mosip.global.end-points=/**/actuator/**,/**/swagger-ui.html,/**/swagger-ui,/**/swagger-ui/**,/**/api-docs,/**/api-docs/**,/v3/api-docs,/v3/api-docs/**,/application-service/**,/sync/datasync-service/**,/captcha-service/**,/appointment/booking-service/**
