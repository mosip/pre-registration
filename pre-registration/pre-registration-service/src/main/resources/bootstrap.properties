spring.cloud.config.uri=https://localhost:8080
spring.cloud.config.label=develop
spring.cloud.config.name=application,pre-registration
spring.application.name=pre-registration-service
spring.profiles.active=mz
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh
management.endpoints.web.base-path=/actuator
spring.info.build.location=classpath:build-info.properties

server.servlet.context-path=/preregistration/v1
server.port=9090

# disabling health check so that client doesnt try to load properties from spring config server every
# 5 minutes (should not be done in production)
health.config.enabled=false
spring.sleuth.enabled=false

mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter
mosip.lang.traslate.adapter.impl.basepackage=io.mosip.kernel.transliteration.icu4j
preregistration.core.restinterceptor.bypass=false

mosip.id.preregistration.demographic.create=mosip.pre-registration.demographic.create
mosip.id.preregistration.demographic.update=mosip.pre-registration.demographic.update
mosip.id.preregistration.demographic.retrieve.date=mosip.pre-registration.demographic.retrieve.date

openapi.info.title=Pre-Registration
openapi.info.description=Consolidated Pre-Registration HTTP service (application, booking, datasync, captcha)
openapi.info.version=1.4.1
openapi.info.license.name=MPL 2.0
openapi.info.license.url=https://www.mozilla.org/en-US/MPL/2.0/
openapi.group.name=${openapi.info.title}
openapi.group.paths[0]=/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persistAuthorization=true
springdoc.api-docs.path=/v3/api-docs
