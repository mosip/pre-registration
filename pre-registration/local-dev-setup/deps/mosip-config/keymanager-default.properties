# Local keymanager overrides (bundled config-server, native profile — no {cipher} values)
spring.application.name=kernel-keymanager-service
mosip.kernel.keymanager.url=http://127.0.0.1:8088

mosip.auth.filter_disable=true
mosip.security.csrf-enable=false
mosip.security.cors-enable=false
mosip.security.secure-cookie=false

# Inbound auth bypass for service-to-service crypto (id-repo → keymanager)
mosip.global.end-points=/**/actuator/**,/**/swagger-ui/**,/**/api-docs/**,/**/keymanager/**
mosip.service-context=
mosip.service.end-points=/**
mosip.service.exclude.auth.allowed.method.kernel-keymanager-service=POST,GET,PUT,PATCH,DELETE

mosip.admin.client.secret=local-dev-secret
mosip.iam.adapter.appid=admin
mosip.iam.adapter.clientid=mosip-admin-client
mosip.iam.adapter.clientsecret=local-dev-secret
mosip.iam.adapter.self-token-renewal-enable=false
