# Overlay for issue-1633 booking in Compose (profile local). Postgres + this stack, not H2.
server.port=9095
server.servlet.context-path=/preregistration/v1
application.env.local=true
spring.http.converters.preferred-json-mapper=jackson2
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:
health.config.enabled=false
management.health.config.enabled=false
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh
spring.info.git.location=classpath:service-git.properties

mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter
# WireMock has no JWKS. kernel-auth-adapter 1.4.1 uses this flag (default true) — not
# auth.server.admin.offline.token.validate — to pick offline JWKS vs OIDC userinfo.
auth.server.admin.offline.token.validate=false
auth.server.admin.offline.comp.token.validate=false
# host.docker.internal — kernel RestTemplate LoadBalancer treats "mock-service" as a
# discovery name ("No servers available") and then NPEs into Tomcat HTML 500.
auth.server.validate.url=http://host.docker.internal:8082/v1/authmanager/authorize/validateToken
auth.server.admin.validate.url=http://host.docker.internal:8082/v1/authmanager/authorize/admin/validateToken
# Online path requires issuer.uri set and issuer.internal.uri empty, then GET oidc.userinfo.url.
auth.server.admin.issuer.uri=http://host.docker.internal:8082/auth/realms/mosip
auth.server.admin.issuer.internal.uri=
auth.server.admin.oidc.userinfo.url=http://host.docker.internal:8082/v1/oidc/userinfo
auth.server.admin.issuer.domain.validate=false
# adapter 1.4.1 ValidateTokenHelper.validateAudience returns false when this is false
# (it does not skip the check). Keep true and list the client in allowed.audience.
auth.server.admin.audience.claim.validate=true
auth.server.admin.allowed.audience=mosip-prereg-client,account,mosip-admin-client,mosip-reg-client
auth.server.admin.allowed.audience.pre-registration-booking-service=mosip-prereg-client,account,mosip-admin-client,mosip-reg-client
auth.role.prefix=ROLE_
auth.header.name=Authorization
spring.security.method-security.enabled=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# Only skip auth on actuator/docs. /** here left SecurityContext empty and booking NPEd on role.startsWith.
mosip.auth.filter_disable=false
mosip.global.end-points=/**/actuator/**,/**/swagger-ui/**,/**/api-docs/**
mosip.service.end-points=/**
mosip.kernel.auth.appids.realm.map={prereg:'preregistration'}
spring.application.name=pre-registration-booking-service
mosip.iam.adapter.clientid=mosip-prereg-client
mosip.iam.adapter.clientsecret=local-dev-secret
mosip.iam.adapter.appid=prereg
prereg.auth.jwt.secret.override=yvrLgmeZY1JtmQAy7+L8xdD+OBnK3DJkuBIYooXsLyo=
prereg.auth.jwt.secret=${prereg.auth.jwt.secret.override}
# BookAppointment uses the prereg login JWT (HS256, prereg.auth.jwt.secret). This provider
# validates that locally. Booking Compose does not load config-server, so the value must
# be set here — not only in pre-registration-default.properties.
mosip.security.authentication.provider.beans.list.pre-registration-booking-service=customJWTAuthProvider

