FetchApplicationByPrid:
   Prereg_FetchApplicationByPrid_All_Valid_Smoke_sid:
      endPoint: /preregistration/v1/applications/prereg/{preRegistrationId}
      uniqueIdentifier: TC_prereg_FetchApplicationByPrid_01
      description: Validate that fetching an application by Pre Registration ID is successfully processed when all mandatory fields are provided with valid values
      role: batch
      restMethod: get
      inputTemplate: preReg/FetchApplicationByPrid/fetchApplicationByPrid
      outputTemplate: preReg/FetchApplicationByPrid/fetchApplicationByPridResult
      input: '{
  "preRegistrationId": "$ID:CreatePrereg_All_Valid_Smoke_sid_pos_preRegistrationId$"
}'
      output: '{
  "preRegistrationId": "$ID:CreatePrereg_All_Valid_Smoke_sid_pos_preRegistrationId$",
  "email": "$ID:UpdatePrereg_All_Valid_Smoke_sid_pos_EMAIL$",
  "phone": "$ID:UpdatePrereg_All_Valid_Smoke_sid_pos_PHONE$"
}'
   Prereg_FetchApplicationByPrid_inValid_preRegistrationId_sid:
      endPoint: /preregistration/v1/applications/prereg/{preRegistrationId}
      uniqueIdentifier: TC_prereg_FetchApplicationByPrid_02
      description: Validate that fetching an application by Pre Registration ID fails when an invalid pre registration ID is provided
      role: batch
      restMethod: get
      inputTemplate: preReg/FetchApplicationByPrid/fetchApplicationByPrid
      outputTemplate: preReg/error
      input: '{
  "preRegistrationId": "ggfr3567ugg"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PRG_PAM_APP_005"
    }
  ]
}'
   Prereg_FetchApplicationByPrid_Without_Auth_Cookie_Neg:
      endPoint: /preregistration/v1/applications/prereg/{preRegistrationId}
      uniqueIdentifier: TC_Prereg_FetchApplicationByPrid_03
      description: Validate that fetching an application by Pre Registration ID is rejected with KER-ATH-401 when the request carries no Authorization cookie
      role: noauth
      restMethod: get
      inputTemplate: preReg/FetchApplicationByPrid/fetchApplicationByPrid
      outputTemplate: preReg/error
      input: '{
  "preRegistrationId": "$ID:CreatePrereg_All_Valid_Smoke_sid_pos_preRegistrationId$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-ATH-401"
    }
  ]
}'
   Prereg_FetchApplicationByPrid_Without_Auth_Cookie_StatusCode_Neg:
      endPoint: /preregistration/v1/applications/prereg/{preRegistrationId}
      uniqueIdentifier: TC_Prereg_FetchApplicationByPrid_11
      description: Validate that fetching an application by Pre Registration ID without an Authorization cookie is rejected with HTTP 401
      role: noauth
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: preReg/FetchApplicationByPrid/fetchApplicationByPrid
      outputTemplate: preReg/responseCode
      input: '{
  "preRegistrationId": "$ID:CreatePrereg_All_Valid_Smoke_sid_pos_preRegistrationId$"
}'
      output: '{
      "responseCode": "401"
}'
