GetPreRegDemographicDataByPrid:
   Prereg_GetPreRegDemographicDataByPrid_Valid_preRegistrationId:
      endPoint: /preregistration/v1/applications/prereg/{preRegistrationId}
      uniqueIdentifier: TC_prereg_GetPreRegDemographicDataByPrid_01
      description: Validate that fetching pre-registration demographic data by Pre Registration ID is successfully processed when a valid pre registration ID is provided
      role: batch
      checkErrorsOnlyInResponse: true
      restMethod: get
      inputTemplate: preReg/GetPreRegDemographicDataByPrid/getPreRegDemographicDataByPrid
      outputTemplate: preReg/GetPreRegDemographicDataByPrid/getPreRegDemographicDataByPridResult
      input: '{
  "preRegistrationId": "$ID:CreatePrereg_Smoke_PreRegDemographicData_sid_pos_preRegistrationId$"
}'
      output: '{
  "preRegistrationId": "$ID:CreatePrereg_Smoke_PreRegDemographicData_sid_pos_preRegistrationId$",
  "postalCode":"14022",
  "dateOfBirth": "$ID:CreatePrereg_Smoke_PreRegDemographicData_sid_pos_dateOfBirth$",
  "IDSchemaVersion": "$SCHEMAVERSION$",
  "phone": "$ID:CreatePrereg_Smoke_PreRegDemographicData_sid_pos_PHONE$"
}'
   Prereg_GetPreRegDemographicDataByPrid_inValid_preRegistrationId:
      endPoint: /preregistration/v1/applications/prereg/info/{preRegistrationId}
      uniqueIdentifier: TC_prereg_GetPreRegDemographicDataByPrid_02
      description: Validate that fetching pre registration demographic data by Pre Registration ID fails when an invalid pre registration ID is provided
      role: batch
      restMethod: get
      inputTemplate: preReg/GetPreRegDemographicDataByPrid/getPreRegDemographicDataByPrid
      outputTemplate: preReg/error
      input: '{
  "preRegistrationId": "123456"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PRG_PAM_APP_005"
    }
  ]
}'