      additionalDependencies: TC_prereg_PiiScenario_14
      input: '{
  "db": "prereg",
  "query": "UPDATE prereg.applicant_demographic SET cr_appuser_id = u.uid, cr_by = u.uid, upd_by = u.uid FROM (SELECT user_id::text AS uid FROM prereg.user_details WHERE upper(identifier_hash) = upper(encode(sha256(convert_to(lower(trim(''$PREREGUSER$'')),''UTF8'')),''hex''))) u WHERE prereg_id = ''$ID:CreatePrereg_PiiRace_Smoke_sid_preRegistrationId$''"
}'
      output: '{
  "updated_rows": "1"
}'
   Prereg_PiiCleanup_LegacyOwner_Applications:
      endPoint: db:mosip_prereg
      uniqueIdentifier: TC_prereg_PiiScenario_26
      description: Validate that the legacy application is returned to the run user UUID
      role: batch
      restMethod: get
      additionalDependencies: TC_prereg_PiiLegacy_02
      input: '{
  "db": "prereg",
  "query": "UPDATE prereg.applications SET cr_by = u.uid, upd_by = u.uid, contact_info = u.uid FROM (SELECT user_id::text AS uid FROM prereg.user_details WHERE upper(identifier_hash) = upper(encode(sha256(convert_to(lower(trim(''$PREREGUSER$'')),''UTF8'')),''hex''))) u WHERE application_id = ''$ID:CreatePrereg_PiiLegacy_Smoke_sid_preRegistrationId$''"
}'
      output: '{
  "updated_rows": "1"
}'
   Prereg_PiiCleanup_LegacyOwner_Demographic:
      endPoint: db:mosip_prereg
      uniqueIdentifier: TC_prereg_PiiScenario_27
      description: Validate that the legacy demographic row is returned to the run user UUID
      role: batch
      restMethod: get
      additionalDependencies: TC_prereg_PiiLegacy_03
      input: '{
  "db": "prereg",
  "query": "UPDATE prereg.applicant_demographic SET cr_appuser_id = u.uid, cr_by = u.uid, upd_by = u.uid FROM (SELECT user_id::text AS uid FROM prereg.user_details WHERE upper(identifier_hash) = upper(encode(sha256(convert_to(lower(trim(''$PREREGUSER$'')),''UTF8'')),''hex''))) u WHERE prereg_id = ''$ID:CreatePrereg_PiiLegacy_Smoke_sid_preRegistrationId$''"
}'
      output: '{
  "updated_rows": "1"
}'
   Prereg_PiiFaultInjection_Teardown:
      endPoint: db:mosip_prereg
      uniqueIdentifier: TC_prereg_PiiScenario_21
      description: Validate that the fault-injection trigger and function are removed
      role: batch
      restMethod: get
      input: '{
  "db": "prereg",
  "query": "DROP TRIGGER IF EXISTS pii_fault_trg_$PIIRUNID$ ON prereg.user_details; DROP FUNCTION IF EXISTS prereg.pii_fault_fn_$PIIRUNID$()"
}'
      output: '{
  "updated_rows": "0"
}'
