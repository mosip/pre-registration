   Prereg_PiiDocOwner_UploadDocument_Smoke_sid:
      endPoint: /preregistration/v1/documents/{preRegistrationId}
      uniqueIdentifier: TC_prereg_PiiDocOwnership_01
      description: Validate that the owner uploads a document to a never-booked pre registration
      role: batch
      restMethod: post
      additionalDependencies: TC_prereg_PiiScenario_22
      input: '{
  "id": "mosip.pre-registration.document.upload",
  "version": "1.0",
  "requesttime": "$TIMESTAMP$",
  "request": {
    "docCatCode": "POA",
    "docTypCode": "RNC",
    "langCode": "$1STLANG$"
  },
  "preRegistrationId": "$ID:CreatePrereg_PiiDocOwner_Smoke_sid_preRegistrationId$",
  "_multipart": "document",
  "_filePath": "preReg/uploadDocument/doc_POA.pdf",
  "_fileKeyName": "file",
  "_idKeyName": "docId"
}'
      output: '{
  "id": "mosip.pre-registration.document.upload",
  "response": {
    "docId": "$REGEXP:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
    "docName": "doc_POA.pdf",
    "docCatCode": "POA",
    "docTypCode": "RNC",
    "docFileFormat": "pdf"
  }
}'
