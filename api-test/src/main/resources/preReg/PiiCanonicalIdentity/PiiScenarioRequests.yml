      description: Validate that the owner can fetch a legacy application and sees UUIDs
      role: batch
      restMethod: get
      additionalDependencies: TC_prereg_PiiLegacy_02,TC_prereg_PiiLegacy_03
      input: '{
  "applicationId": "$ID:CreatePrereg_PiiLegacy_Smoke_sid_preRegistrationId$"
}'
