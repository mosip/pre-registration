      output: '{
  "_mustContain": ["$ID:CreatePrereg_PiiLegacy_Smoke_sid_preRegistrationId$"]
}'
   Prereg_PiiLegacyList_PiiCompatOff_LegacyExcluded:
      endPoint: /preregistration/v1/applications
