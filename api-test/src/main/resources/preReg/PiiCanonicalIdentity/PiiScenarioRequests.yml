      role: regproc
      restMethod: post
      additionalDependencies: TC_prereg_PiiScenario_02
      input: '{
  "id": "mosip.pre-registration.datasync.store",
  "version": "1.0",
  "requesttime": "$TIMESTAMP$",
  "request": {
    "preRegistrationIds": [
      "$ID:CreatePrereg_PiiConsumed_Smoke_sid_preRegistrationId$"
