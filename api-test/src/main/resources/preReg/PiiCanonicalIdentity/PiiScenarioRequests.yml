PiiScenarioRequests:
   Prereg_PiiLegacyRead_PiiCompatOn_GetPreRegData:
      endPoint: /preregistration/v1/applications/prereg/{preRegistrationId}
      uniqueIdentifier: TC_prereg_PiiLegacy_04
      description: Validate that the owner can fetch a legacy pre registration and sees the UUID
      role: batch
      restMethod: get
      additionalDependencies: TC_prereg_PiiLegacy_02,TC_prereg_PiiLegacy_03
      input: '{
  "preRegistrationId": "$ID:CreatePrereg_PiiLegacy_Smoke_sid_preRegistrationId$"
}'
      output: '{
  "response": {
    "createdBy": "$REGEXP:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
    "updatedBy": "$REGEXP:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  }
}'
   Prereg_PiiLegacyRead_PiiCompatOn_GetApplicationInfo:
      endPoint: /preregistration/v1/applications/{applicationId}
