      role: batch
      restMethod: get
      additionalDependencies: TC_prereg_PiiLegacy_02,TC_prereg_PiiLegacy_03
      input: '{}'
      output: '{
  "_mustContain": ["allApplications"],
  "_mustNotContain": ["$ID:CreatePrereg_PiiLegacy_Smoke_sid_preRegistrationId$", "$PREREGUSER$"]
}'
