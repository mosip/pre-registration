#---------------------------------- Local Docker deps (does NOT replace prereg.properties) ----------#
# Selected via: -Dprereg.propertiesFile=prereg-local.properties
# Stack: pre-registration/local-dev-setup
#   - Host pre-registration-service on :9090 (run-prereg-local.bat / .sh)
#   - WireMock local IAM + masterdata on :8082
#   - Host JVM booking-native /preregistration/v1/appointment/** on :9090
#   - Docker mock-smtp-sms (mosipid/mock-smtp) UI :8080, SMTP :8025, WS :8081
#   - Docker notifier :8083 (forwards /v1/notifier to mock-smtp)
# Server / QA runs keep using default prereg.properties.
#
# Secrets: leave blank here. run-local-smoke.(bat|sh) supplies local-dev defaults
# (or .env.local). ConfigManager reads System.getenv(key) over file values.

piiBackwardCompatibility = true
preregActuatorEndpoint = /preregistration/v1/actuator/env

# Local IAM is WireMock (no Keycloak container).
keycloak-external-url = http://localhost:8082

# Local Postgres (compose maps 5455 → 5432). PII cases query mosip_audit.app_audit_log via db:mosip_audit.
audit_url = jdbc:postgresql://localhost:5455/mosip_audit
partner_url = jdbc:postgresql://localhost:5455/mosip_prereg
db-server = localhost
db-port = 5455
db-su-user = postgres
postgres-password =

keycloak_Password =

mosip_partner_client_secret =
mosip_pms_client_secret =
mosip_resident_client_secret =
mosip_idrepo_client_secret =
mosip_reg_client_secret =
mosip_admin_client_secret =
mosip_hotlist_client_secret =
mosip_regproc_client_secret =
mpartner_default_mobile_secret =
mosip_testrig_client_secret =
AuthClientSecret =
mosip_crvs1_client_secret =

enableDebug = yes
mockNotificationChannel = email,phone
# Commons NotificationListener.getOtp treats only "true" as skip-mailbox (not "yes").
# Local mock-smtp websocket; sendOtp is forwarded to SMTP :8025 by deps/notifier.
mockSmtpWebSocketUrl = ws://localhost:8081
usePreConfiguredOtp = false
preconfiguredOtp = 111111
push-reports-to-s3 = no
mountPathForReport = target/local-reports
authCertsPath = target/local-authcerts
xssProtectionCheck = no

# Modules not present in local compose — skip related cases where the framework checks this list.
servicesNotDeployed = resident,esignet,regproc,idrepo,hotlist,ida,partner,mimoto,rid_generator

# Host JVM under test on :9090 (application + datasync + captcha + booking); keymanager on :8088; mock-smtp on :8080/:8025/:8081; notifier on :8083; WireMock on :8082 for IAM / masterdata / audit.
# booking=localhost:9090 sends frozen /preregistration/v1/appointment/** (not /applications/appointment/**) to the same HTTP JVM.
mosip_components_base_urls = preregistration=localhost:9090;booking=localhost:9090;authmanager=localhost:8082;masterdata=localhost:8082;auditmanager=localhost:8082;notifier=localhost:8083;pridgenerator=localhost:8082;keymanager=localhost:8088

moduleNamePattern =
testCasesToExecute =

# Wipe leftover applications/docs/bookings/otp/user_details at suite setup (same timing as idrepo).
# Slot seed and batch tables are kept. This run's rows stay until the next start.
dbCleanupScope = allTransactional
